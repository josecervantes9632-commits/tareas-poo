<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="955" viewBox="0 0 1420 955"><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 z" fill="#e8590c"/></marker><marker id="tri" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L18,9 L0,18 z" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="40" y="54" font-size="34" font-family="Segoe UI, Arial, sans-serif" font-weight="bold" fill="#1e1e1e" text-anchor="start">Herencia múltiple: super() + **kwargs + MRO</text>
<text x="40" y="88" font-size="20" font-family="Segoe UI, Arial, sans-serif" font-weight="normal" fill="#495057" text-anchor="start">Ejemplo: class StreamerGamer(Jugador, Streamer)</text>
<text x="40" y="144" font-size="24" font-family="Segoe UI, Arial, sans-serif" font-weight="bold" fill="#e03131" text-anchor="start">① Relación de herencia</text>
<rect x="40" y="165" width="270" height="148" rx="12" fill="#ffec99" stroke="#1e1e1e" stroke-width="2"/>
<text x="175.0" y="199" font-size="24" font-family="Segoe UI, Arial, sans-serif" font-weight="bold" fill="#1e1e1e" text-anchor="middle">Jugador</text>
<text x="54" y="230" font-size="17" font-family="Consolas, monospace" font-weight="normal" fill="#1e1e1e" text-anchor="start">+ juego</text>
<text x="54" y="256" font-size="17" font-family="Consolas, monospace" font-weight="normal" fill="#1e1e1e" text-anchor="start">+ rango</text>
<text x="54" y="288" font-size="17" font-family="Consolas, monospace" font-weight="normal" fill="#1971c2" text-anchor="start">+ jugar()</text>
<rect x="350" y="165" width="270" height="148" rx="12" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
<text x="485.0" y="199" font-size="24" font-family="Segoe UI, Arial, sans-serif" font-weight="bold" fill="#1e1e1e" text-anchor="middle">Streamer</text>
<text x="364" y="230" font-size="17" font-family="Consolas, monospace" font-weight="normal" fill="#1e1e1e" text-anchor="start">+ plataforma</text>
<text x="364" y="256" font-size="17" font-family="Consolas, monospace" font-weight="normal" fill="#1e1e1e" text-anchor="start">+ seguidores</text>
<text x="364" y="288" font-size="17" font-family="Consolas, monospace" font-weight="normal" fill="#1971c2" text-anchor="start">+ transmitir()</text>
<rect x="175" y="420" width="310" height="148" rx="12" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<text x="330.0" y="454" font-size="24" font-family="Segoe UI, Arial, sans-serif" font-weight="bold" fill="#1e1e1e" text-anchor="middle">StreamerGamer</text>
<text x="189" y="485" font-size="17" font-family="Consolas, monospace" font-weight="normal" fill="#1e1e1e" text-anchor="start">+ nombre</text>
<text x="189" y="511" font-size="17" font-family="Consolas, monospace" font-weight="normal" fill="#1e1e1e" text-anchor="start">(hereda los 4 de arriba)</text>
<text x="189" y="543" font-size="17" font-family="Consolas, monospace" font-weight="normal" fill="#1971c2" text-anchor="start">+ presentarse()</text>
<line x1="290" y1="420" x2="190" y2="310" stroke="#1e1e1e" stroke-width="2.5" marker-end="url(#tri)"/>
<line x1="370" y1="420" x2="470" y2="310" stroke="#1e1e1e" stroke-width="2.5" marker-end="url(#tri)"/>
<text x="70" y="351" font-size="16" font-family="Segoe UI, Arial, sans-serif" font-weight="normal" fill="#495057" text-anchor="start">1er padre</text>
<text x="470" y="351" font-size="16" font-family="Segoe UI, Arial, sans-serif" font-weight="normal" fill="#495057" text-anchor="start">2º padre</text>
<text x="40" y="617" font-size="17" font-family="Segoe UI, Arial, sans-serif" font-weight="normal" fill="#495057" text-anchor="start">La flecha ▷ significa &quot;hereda de&quot;.</text>
<text x="40" y="638" font-size="17" font-family="Segoe UI, Arial, sans-serif" font-weight="normal" fill="#495057" text-anchor="start">El orden (Jugador, Streamer) define el MRO.</text>
<text x="720" y="144" font-size="24" font-family="Segoe UI, Arial, sans-serif" font-weight="bold" fill="#e03131" text-anchor="start">② MRO y viaje de los parámetros</text>
<rect x="720" y="170" width="300" height="70" rx="12" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<text x="870.0" y="214" font-size="24" font-family="Segoe UI, Arial, sans-serif" font-weight="bold" fill="#1e1e1e" text-anchor="middle">1. StreamerGamer</text>
<text x="1040" y="198" font-size="18" font-family="Segoe UI, Arial, sans-serif" font-weight="bold" fill="#2f9e44" text-anchor="start">✔ se queda: nombre</text>
<line x1="870.0" y1="240" x2="870.0" y2="320" stroke="#e8590c" stroke-width="2.5" marker-end="url(#arr)"/>
<text x="888.0" y="274" font-size="16" font-family="Consolas, monospace" font-weight="normal" fill="#e8590c" text-anchor="start">super().__init__(juego, rango,</text>
<text x="888.0" y="294" font-size="16" font-family="Consolas, monospace" font-weight="normal" fill="#e8590c" text-anchor="start">  plataforma, seguidores)</text>
<rect x="720" y="320" width="300" height="70" rx="12" fill="#ffec99" stroke="#1e1e1e" stroke-width="2"/>
<text x="870.0" y="364" font-size="24" font-family="Segoe UI, Arial, sans-serif" font-weight="bold" fill="#1e1e1e" text-anchor="middle">2. Jugador</text>
<text x="1040" y="348" font-size="18" font-family="Segoe UI, Arial, sans-serif" font-weight="bold" fill="#2f9e44" text-anchor="start">✔ se queda: juego, rango</text>
<line x1="870.0" y1="390" x2="870.0" y2="470" stroke="#e8590c" stroke-width="2.5" marker-end="url(#arr)"/>
<text x="888.0" y="424" font-size="16" font-family="Consolas, monospace" font-weight="normal" fill="#e8590c" text-anchor="start">**kwargs = {plataforma, seguidores}</text>
<rect x="720" y="470" width="300" height="70" rx="12" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
<text x="870.0" y="514" font-size="24" font-family="Segoe UI, Arial, sans-serif" font-weight="bold" fill="#1e1e1e" text-anchor="middle">3. Streamer</text>
<text x="1040" y="498" font-size="18" font-family="Segoe UI, Arial, sans-serif" font-weight="bold" fill="#2f9e44" text-anchor="start">✔ se queda: plataforma, seguidores</text>
<line x1="870.0" y1="540" x2="870.0" y2="620" stroke="#e8590c" stroke-width="2.5" marker-end="url(#arr)"/>
<text x="888.0" y="574" font-size="16" font-family="Consolas, monospace" font-weight="normal" fill="#e8590c" text-anchor="start">**kwargs = { }  (vacío)</text>
<rect x="720" y="620" width="300" height="70" rx="12" fill="#e9ecef" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="8 6"/>
<text x="870.0" y="664" font-size="24" font-family="Segoe UI, Arial, sans-serif" font-weight="bold" fill="#1e1e1e" text-anchor="middle">4. object</text>
<text x="1040" y="648" font-size="18" font-family="Segoe UI, Arial, sans-serif" font-weight="bold" fill="#2f9e44" text-anchor="start">✔ fin de la cadena</text>
<text x="1040" y="674" font-size="16" font-family="Segoe UI, Arial, sans-serif" font-weight="normal" fill="#495057" text-anchor="start">object.__init__() no recibe nada</text>
<rect x="40" y="730" width="1340" height="200" rx="12" fill="#fff9db" stroke="#f08c00" stroke-width="2"/>
<text x="60" y="768" font-size="24" font-family="Segoe UI, Arial, sans-serif" font-weight="bold" fill="#e03131" text-anchor="start">Explicación</text>
<text x="60" y="804" font-size="18" font-family="Segoe UI, Arial, sans-serif" font-weight="normal" fill="#1e1e1e" text-anchor="start">• super() no llama a &quot;el padre&quot;, sino a la SIGUIENTE clase del MRO: StreamerGamer → Jugador → Streamer → object.</text>
<text x="60" y="826" font-size="18" font-family="Segoe UI, Arial, sans-serif" font-weight="normal" fill="#1e1e1e" text-anchor="start">• **kwargs es la &quot;bolsa&quot; de parámetros: cada clase saca los que necesita y reenvía el resto con super().__init__(**kwargs).</text>
<text x="60" y="849" font-size="18" font-family="Segoe UI, Arial, sans-serif" font-weight="normal" fill="#1e1e1e" text-anchor="start">• Jugador toma juego y rango; Streamer toma plataforma y seguidores; así ningún padre recibe argumentos inesperados.</text>
<text x="60" y="872" font-size="18" font-family="Segoe UI, Arial, sans-serif" font-weight="normal" fill="#1e1e1e" text-anchor="start">• Termina en object porque toda clase en Python hereda de object: es el último eslabón del MRO.</text>
<text x="60" y="894" font-size="18" font-family="Segoe UI, Arial, sans-serif" font-weight="normal" fill="#1e1e1e" text-anchor="start">• Cuando la bolsa llega vacía, object.__init__() se ejecuta sin argumentos y la cadena se cierra sin TypeError.</text></svg>